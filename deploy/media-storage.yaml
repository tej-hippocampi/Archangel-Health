AWSTemplateFormatVersion: '2010-09-09'
Description: Archangel private original-media storage (does not enable uploads).
Parameters:
  PortalOrigin:
    Type: String
    AllowedPattern: 'https://[^/ *]+'
Resources:
  Key:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
  Originals:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt Key.Arn
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref PortalOrigin]
            AllowedMethods: [PUT, GET, HEAD]
            AllowedHeaders: [content-type, x-amz-checksum-sha256]
            ExposedHeaders: [ETag, x-amz-checksum-sha256, x-amz-version-id]
            MaxAge: 300
  TransportPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Originals
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt Originals.Arn, !Sub '${Originals.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
Outputs:
  Bucket:
    Value: !Ref Originals
  KmsKey:
    Value: !GetAtt Key.Arn
