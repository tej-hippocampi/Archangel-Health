name: LLM smoke (real models)

# Fake LLM Provider PRD §3 — real-model testing lives HERE, not in a sandbox.
#
# The development sandbox holds no API key by design (ASCLEPIUS_LLM_PROVIDER=fake
# covers every LLM path deterministically). The one thing a fake cannot tell you is
# whether the real vendors still answer the way the prompts expect — so that check
# runs in CI, where the key is a GitHub secret that never leaves GitHub.
#
# workflow_dispatch ONLY. It spends real tokens against real models, so it is never
# on push or pull_request: an agent pushes a branch, a human clicks Run.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Clinical generation path to verify
        default: multimodal
        type: choice
        options: [multimodal, onboarding, onboarding-library, onboarding-openai-trial, ehr-sandbox]
      specialty:
        description: Specialty to generate against
        default: nephrology
        type: string
      n:
        description: How many cases to generate (keep small — this spends tokens)
        default: "2"
        type: string
      ref:
        description: Branch or SHA to run (defaults to the branch you dispatch from)
        default: ""
        type: string

concurrency:
  group: llm-smoke
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      specialties: ${{ steps.matrix.outputs.specialties }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        if: inputs.mode == 'onboarding-library' || inputs.mode == 'onboarding-openai-trial'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install reviewer preflight dependencies
        if: inputs.mode == 'onboarding-library' || inputs.mode == 'onboarding-openai-trial'
        run: pip install -r backend/requirements.txt
      - name: Check reviewer before starting specialty jobs
        if: inputs.mode == 'onboarding-library'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ASCLEPIUS_LLM_PROVIDER: ""
        run: python3 backend/scripts/check_onboarding_reviewer.py
      - name: Check OpenAI trial access before any authorship
        if: inputs.mode == 'onboarding-openai-trial'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_ASCLEPIUS_CASE_GEN: gpt-5.6-sol
          ASCLEPIUS_LLM_PROVIDER: ""
        run: python3 backend/scripts/trial_onboarding_openai.py --check-access
      - id: matrix
        env:
          SMOKE_SPECIALTY: ${{ inputs.specialty }}
          SMOKE_MODE: ${{ inputs.mode }}
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          if os.environ['SMOKE_MODE'] == 'onboarding-library':
              values = json.loads(subprocess.check_output(['python3', 'backend/scripts/build_onboarding_library.py', '--matrix']))
          elif os.environ['SMOKE_MODE'] == 'onboarding-openai-trial':
              values = json.loads(subprocess.check_output(['python3', 'backend/scripts/trial_onboarding_openai.py', '--matrix', '--specialty', os.environ['SMOKE_SPECIALTY']]))
          else:
              values = [os.environ['SMOKE_SPECIALTY']]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('specialties=' + json.dumps(values) + '\n')
          PYCODE
  smoke:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.mode == 'onboarding-openai-trial' && 4 || 8 }}
      matrix:
        specialty: ${{ fromJson(needs.plan.outputs.specialties) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Confirm the fake is OFF
        # A smoke test that silently ran against the fake would report a green
        # real-model check while touching no model at all — the exact false
        # negative this workflow exists to prevent.
        env:
          ASCLEPIUS_LLM_PROVIDER: ""
        run: |
          test -z "${ASCLEPIUS_LLM_PROVIDER}" || {
            echo "::error::ASCLEPIUS_LLM_PROVIDER must be empty for the real-model smoke"
            exit 1
          }

      - name: Run the multimodal smoke
        if: inputs.mode != 'onboarding-openai-trial' && inputs.mode != 'ehr-sandbox'
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ASCLEPIUS_DB_PATH: ${{ runner.temp }}/smoke.db
          ASCLEPIUS_EXPORT_DIR: ${{ runner.temp }}/smoke-exports
          SMOKE_MODE: ${{ inputs.mode || 'multimodal' }}
          SMOKE_SPECIALTY: ${{ matrix.specialty }}
          SMOKE_COUNT: ${{ inputs.n }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set on this repository"
            exit 1
          fi
          if [ "$SMOKE_MODE" = "onboarding-library" ]; then
            # Use the existing OpenAI transport for batch authorship. Reviewers
            # remain independent Anthropic + OpenAI; paid generation is unchanged.
            export OPENAI_MODEL="${OPENAI_MODEL:-gpt-5.6-sol}"
            export MODEL_ASCLEPIUS_CASE_GEN="${OPENAI_MODEL}"
            python3 scripts/build_onboarding_library.py --specialty "$SMOKE_SPECIALTY" --output "${RUNNER_TEMP}/onboarding-cases" --diagnostics "${RUNNER_TEMP}/onboarding-review-diagnostics" 2>&1 | tee "${RUNNER_TEMP}/smoke-report.txt"
          elif [ "$SMOKE_MODE" = "onboarding" ]; then
            python3 scripts/smoke_onboarding_cases.py --specialty "$SMOKE_SPECIALTY" 2>&1 | tee "${RUNNER_TEMP}/smoke-report.txt"
          else
            python3 scripts/smoke_multimodal.py --specialty "$SMOKE_SPECIALTY" --n "$SMOKE_COUNT" 2>&1 | tee "${RUNNER_TEMP}/smoke-report.txt"
          fi

      - name: Prepare synthetic EHR uploads and qualify the complete pipeline
        if: inputs.mode == 'ehr-sandbox'
        working-directory: backend
        env:
          ASCLEPIUS_LLM_PROVIDER: fake
          EHR_SMOKE_TASKS_OUT: ${{ runner.temp }}/ehr-synthetic-tasks.json
        run: |
          pip install pytest
          python3 -m pytest tests/test_ehr_sandbox_upload_pipeline.py -q -s --disable-warnings

      - name: Qualify real agents on public synthetic EHR tasks
        if: inputs.mode == 'ehr-sandbox'
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ASCLEPIUS_LLM_PROVIDER: ""
          ASCLEPIUS_DB_PATH: ${{ runner.temp }}/ehr-smoke.db
          ASCLEPIUS_EXPORT_DIR: ${{ runner.temp }}/ehr-smoke-exports
          EMAIL_DEV_MODE: "1"
          LLM_TIMEOUT_SEC: "90"
        run: |
          set -euo pipefail
          python3 scripts/smoke_ehr_sandbox.py --tasks "${RUNNER_TEMP}/ehr-synthetic-tasks.json" --output "${RUNNER_TEMP}/ehr-smoke-results.json" 2>&1 | tee "${RUNNER_TEMP}/smoke-report.txt"

      - name: Run OpenAI-only onboarding experiment
        if: inputs.mode == 'onboarding-openai-trial'
        working-directory: backend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MODEL_ASCLEPIUS_CASE_GEN: gpt-5.6-sol
          ASCLEPIUS_LLM_PROVIDER: ""
          ASCLEPIUS_DB_PATH: ${{ runner.temp }}/openai-trial.db
          ASCLEPIUS_EXPORT_DIR: ${{ runner.temp }}/openai-trial-exports
          SMOKE_SPECIALTY: ${{ matrix.specialty }}
        run: |
          set -euo pipefail
          python3 scripts/trial_onboarding_openai.py --specialty "$SMOKE_SPECIALTY" --output "${RUNNER_TEMP}/openai-trial-results" 2>&1 | tee "${RUNNER_TEMP}/smoke-report.txt"

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-smoke-${{ matrix.specialty }}
          path: |
            ${{ runner.temp }}/smoke-report.txt
            ${{ runner.temp }}/onboarding-cases/*.json
            ${{ runner.temp }}/onboarding-review-diagnostics/*.json
            ${{ runner.temp }}/openai-trial-results/*.json
            ${{ runner.temp }}/ehr-smoke-results.json
          if-no-files-found: warn
