# Backup for the in-process daily scheduler. Both use the same persisted claims.
# Required repository secrets: MORNING_BASE_URL and INTERNAL_TOOL_SECRET.
name: community-morning

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-morning
  cancel-in-progress: false

jobs:
  news:
    # An unrelated morning/email timeout must never prevent the news attempt.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Publish today's medical AI digest if due
        env:
          MORNING_BASE_URL: ${{ secrets.MORNING_BASE_URL }}
          INTERNAL_TOOL_SECRET: ${{ secrets.INTERNAL_TOOL_SECRET }}
        run: python3 backend/scripts/run_community_schedule.py news

  routine:
    needs: news
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run the remaining community routines
        env:
          MORNING_BASE_URL: ${{ secrets.MORNING_BASE_URL }}
          INTERNAL_TOOL_SECRET: ${{ secrets.INTERNAL_TOOL_SECRET }}
        run: python3 backend/scripts/run_community_schedule.py routine
