name: Security

# Dependency vulnerability + secret scanning (PRD-7). Runs on every PR/push to
# main and weekly, so new CVEs in our dependencies surface on a defined cadence
# (the 2025 HIPAA Security Rule NPRM proposes vuln scans at least every 6 months;
# this far exceeds that).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  pip-audit:
    name: Dependency vulnerability scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pip-audit
      - name: Audit installed dependencies
        run: pip-audit --progress-spinner off

  npm-audit:
    name: Frontend dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Audit production and build dependencies
        working-directory: landing
        run: npm audit --audit-level=low

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so committed-then-deleted secrets are caught
      - name: Run gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            -o "$ARCHIVE"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt" \
            -o checksums.txt
          grep "  ${ARCHIVE}$" checksums.txt | sha256sum --check --strict
          tar -xzf "$ARCHIVE" gitleaks
          ./gitleaks git . --no-banner --redact
