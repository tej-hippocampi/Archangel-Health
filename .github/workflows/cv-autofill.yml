name: CV extraction and autofill
on:
  pull_request:
    paths:
      - 'backend/asclepius/credentialing.py'
      - 'backend/team_store.py'
      - 'backend/routers/onboarding.py'
      - 'backend/tests/**'
      - 'landing/src/app/components/**'
      - 'landing/tests/cv-autofill.test.cjs'
      - '.github/workflows/cv-autofill.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cv-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - run: pip install -r backend/requirements.txt pytest pytest-asyncio
      - run: node --test landing/tests/cv-autofill.test.cjs
      - working-directory: backend
        env:
          CV_REQUIRE_CORPUS: '1'
          CV_REQUIRE_OCR: '1'
        run: python -m pytest tests/test_cv_autofill_regressions.py tests/test_cv_upload_corpus.py tests/test_cv_parse_quality.py tests/test_onboarding_v2.py tests/test_onboarding_review_clarity.py -q
