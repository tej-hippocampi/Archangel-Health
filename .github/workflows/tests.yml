name: Tests

# Backend test suite (pytest). Runs on every PR and on push to main so the whole
# surface — including the Asclepius eval portal (packaging, validation, router,
# export) — is gated automatically rather than relying on a local run. The suite
# is hermetic: the LLM judge is mocked, no secrets or network are required, and
# the Asclepius portal is pointed at throwaway temp paths by tests/conftest.py.

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run. The Asclepius submission pipeline is deliberately
  # nondeterministic in places (`pipeline._should_sample` spot-checks a
  # percentage of submissions into QA), and a couple of the websocket tests are
  # timing-sensitive, so a red run is not always a real regression. Without this
  # the only way to re-run is an empty commit, which pollutes main's history.
  workflow_dispatch:

# Cancel superseded runs on the same ref so a force-push doesn't pile up jobs.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    # 20 minutes stopped being a ceiling and became a coin toss. The suite is
    # ~3,350 tests and takes 13-20 minutes on a GitHub runner depending on how
    # noisy the runner is; the push-to-main run for f684623 finished its 19m38s
    # of testing and was killed at 20m16s with everything passing.
    #
    # A timeout-killed job is reported as CANCELLED, not FAILED, and it writes
    # no summary line — so the only artifact is a grey X on main and no
    # indication of which test broke, because none did. That failure mode is
    # worse than a slow build: it looks exactly like a real regression and
    # costs someone an afternoon proving it isn't one.
    #
    # 30 is headroom, not a target. If the suite genuinely approaches it, the
    # answer is to split this job (pytest-xdist or a matrix over test files),
    # not to keep raising the number — but that is a real change, and it wants
    # care around the websocket tests noted below, which get flakier under
    # parallelism rather than faster.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        # RATE_LIMIT_ENABLED + the Asclepius DB/export temp paths are defaulted in
        # tests/conftest.py; nothing else is needed to boot the app under test.
        # The rendered-appearance gate lives in its own job below (it needs a
        # browser), and is deselected here so this job stays browser-free.
        run: pytest -q --durations=10 --ignore=tests/test_asclepius_visual.py

  visual:
    # Rendered-appearance gate for the Asclepius eval portal. Split out because it
    # is the only job needing a browser, and because a browser flake should read as
    # "the visual gate is red", not as a backend failure.
    #
    # This exists because two defects reached main through a fully green suite —
    # a `text-transform: capitalize` Title-Casing the plain-language rubric axis
    # options, and the rubric slider painting in the user-agent's default blue in
    # a palette that has no blue. Neither is visible to a source assertion: one is
    # paint-only, the other never appears in the CSSOM at all.
    name: Rendered appearance (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest playwright   # Pillow comes from requirements.txt
      - name: Install Chromium
        # --with-deps pulls the system libraries headless Chromium needs; without
        # it the launch fails and every test in the file SKIPS, which would look
        # green while checking nothing.
        run: python -m playwright install --with-deps chromium
      - name: Run the rendered-appearance gate
        # A silent skip is the failure mode this job exists to prevent: the file
        # skips cleanly when no browser is present, which is right for a laptop
        # and useless here — it would report green while checking nothing. So the
        # run is failed on any skip.
        #
        # `pipefail` matters: without it the pipeline takes tee's exit status and
        # a genuine test failure would pass silently.
        run: |
          set -o pipefail
          pytest tests/test_asclepius_visual.py -q -rs | tee /tmp/visual.log
          if grep -qE "[0-9]+ skipped" /tmp/visual.log; then
            echo "::error::the rendered-appearance gate skipped instead of running \
          — Chromium was not available to playwright"
            exit 1
          fi
