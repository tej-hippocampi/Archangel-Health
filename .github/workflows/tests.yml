name: Tests

# Backend test suite (pytest). Runs on every PR and on push to main so the whole
# surface — including the Asclepius eval portal (packaging, validation, router,
# export) — is gated automatically rather than relying on a local run. The suite
# is hermetic: the LLM judge is mocked, no secrets or network are required, and
# the Asclepius portal is pointed at throwaway temp paths by tests/conftest.py.

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-run. The Asclepius submission pipeline is deliberately
  # nondeterministic in places (`pipeline._should_sample` spot-checks a
  # percentage of submissions into QA), and a couple of the websocket tests are
  # timing-sensitive, so a red run is not always a real regression. Without this
  # the only way to re-run is an empty commit, which pollutes main's history.
  workflow_dispatch:

# Cancel superseded runs on the same ref so a force-push doesn't pile up jobs.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    # SHARDED. The suite is ~3,750 tests and about 13 minutes of test time on a
    # good runner. That fitted in one job until it didn't: the push-to-main run
    # for 6674462 was killed by the 30-minute ceiling at 29m47s with nothing
    # failing, on a tree whose full suite runs in 13m22s locally. A noisy runner
    # was enough to more than double it.
    #
    # A timeout-killed job reports as CANCELLED, not FAILED, and writes no summary
    # line — so the only artifact is a grey X on main and no indication of which
    # test broke, because none did. That failure mode is worse than a slow build:
    # it looks exactly like a real regression and costs someone an afternoon
    # proving it isn't one. Raising the number again just moves the cliff.
    #
    # So the job is split across ${CI_TOTAL_SHARDS} runners, each running its
    # slice SERIALLY. Serial, on separate machines, is the point: the timing-
    # sensitive websocket cases in tests/test_community.py "get flakier under
    # parallelism rather than faster", so pytest-xdist would trade a wall-clock
    # win for a flakiness loss. A matrix gives every shard a whole machine, so no
    # test ever shares a CPU with another test.
    #
    # Which file goes to which shard is decided by backend/scripts/ci_shard.py.
    # The assignment is DETERMINISTIC (a failing shard reproduces locally with
    # `python3 scripts/ci_shard.py <n> <total>`) and TOTAL (every test file lands
    # in exactly one shard — asserted by tests/test_ci_sharding.py, which runs in
    # the matrix itself, so a new test file cannot silently fall out of CI).
    name: Backend pytest (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Each shard is ~4 minutes of test time. 20 is deep headroom for a noisy
    # runner, not a target — if a shard genuinely approaches it, re-measure the
    # weights before touching this number.
    timeout-minutes: 20
    strategy:
      # One shard's failure must not cancel the others: the whole point is to see
      # every failure in one run rather than rediscovering them one build at a time.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      CI_TOTAL_SHARDS: 4
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run tests
        # RATE_LIMIT_ENABLED + the Asclepius DB/export temp paths are defaulted in
        # tests/conftest.py; nothing else is needed to boot the app under test.
        # The rendered-appearance gate lives in its own job below (it needs a
        # browser); ci_shard.py excludes it so it is never run twice.
        #
        # `set -euo pipefail` is load-bearing. If ci_shard.py failed or printed
        # nothing, an unguarded `pytest $(...)` would collect the ENTIRE suite from
        # the rootdir — every shard running everything, silently turning a 4-way
        # split back into four full runs. The empty check makes that impossible.
        run: |
          set -euo pipefail
          FILES=$(python3 scripts/ci_shard.py "${{ matrix.shard }}" "$CI_TOTAL_SHARDS")
          if [ -z "$FILES" ]; then
            echo "::error::shard ${{ matrix.shard }}/$CI_TOTAL_SHARDS resolved to no \
          test files — refusing to run, because bare pytest would collect everything"
            exit 1
          fi
          echo "shard ${{ matrix.shard }}/$CI_TOTAL_SHARDS — $(echo "$FILES" | wc -l) file(s)"
          pytest -q --durations=10 $FILES

  visual:
    # Rendered-appearance gate for the Asclepius eval portal. Split out because it
    # is the only job needing a browser, and because a browser flake should read as
    # "the visual gate is red", not as a backend failure.
    #
    # This exists because two defects reached main through a fully green suite —
    # a `text-transform: capitalize` Title-Casing the plain-language rubric axis
    # options, and the rubric slider painting in the user-agent's default blue in
    # a palette that has no blue. Neither is visible to a source assertion: one is
    # paint-only, the other never appears in the CSSOM at all.
    name: Rendered appearance (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest playwright   # Pillow comes from requirements.txt
      - name: Install Chromium
        # --with-deps pulls the system libraries headless Chromium needs; without
        # it the launch fails and every test in the file SKIPS, which would look
        # green while checking nothing.
        run: python -m playwright install --with-deps chromium
      - name: Run the rendered-appearance gate
        # A silent skip is the failure mode this job exists to prevent: the file
        # skips cleanly when no browser is present, which is right for a laptop
        # and useless here — it would report green while checking nothing. So the
        # run is failed on any skip.
        #
        # `pipefail` matters: without it the pipeline takes tee's exit status and
        # a genuine test failure would pass silently.
        run: |
          set -o pipefail
          pytest tests/test_asclepius_visual.py -q -rs | tee /tmp/visual.log
          if grep -qE "[0-9]+ skipped" /tmp/visual.log; then
            echo "::error::the rendered-appearance gate skipped instead of running \
          — Chromium was not available to playwright"
            exit 1
          fi
