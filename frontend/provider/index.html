<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secure Upload Portal | Archangel Health</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Secure upload portal for health systems partnering with Archangel Health." />

  <!-- Console design system — self-hosted fonts + shared tokens (frontend dir is mounted at /static). -->
  <link rel="stylesheet" href="/static/asclepius/clinical-fonts.css" />
  <link rel="stylesheet" href="/static/asclepius/_tokens.css" />
  <link rel="stylesheet" href="/static/asclepius/_base.css" />
  <link rel="stylesheet" href="/static/asclepius/asclepius.css" />
  <!-- Portal-specific styling (drop zone, status list, secure-login chrome). -->
  <link rel="stylesheet" href="/static/provider/provider.css" />
</head>
<body class="asc-body prv-body">

  <!-- ══════════════════════════════════════════════════════════
       Header — only shown once authenticated + reset complete.
       ══════════════════════════════════════════════════════════ -->
  <header class="asc-header" id="prvHeader" hidden>
    <div class="asc-header-inner">
      <a class="asc-logo" href="/provider">
        <span class="asc-logo-mark" aria-hidden="true"></span>
        <span class="asc-logo-text">Archangel Health<span class="asc-logo-sub">Secure Upload Portal</span></span>
      </a>
      <div class="asc-header-right">
        <div class="asc-user-badge" id="prvUserBadge"></div>
        <button type="button" class="asc-btn asc-btn-ghost asc-btn-sm" id="prvLogoutBtn">Sign out</button>
      </div>
    </div>
  </header>

  <!-- ══════════════════════════════════════════════════════════
       Root — JS swaps between: loading / login / reset / upload.
       aria-live announces screen changes to assistive tech.
       ══════════════════════════════════════════════════════════ -->
  <main class="prv-main" id="prvRoot" aria-live="polite">
    <div class="asc-loading-screen">
      <div class="loading-spinner" aria-hidden="true"></div>
      <p>Loading secure portal…</p>
    </div>
  </main>

  <!-- ─── SCREEN TEMPLATES ─────────────────────────────────────
       Kept as inert <template> nodes and cloned by provider.js so
       the markup stays declarative and easy to audit. All dynamic,
       server-provided text is injected via textContent (never
       innerHTML) inside provider.js. -->

  <!-- 1) LOGIN -->
  <template id="tplLogin">
    <div class="prv-auth-wrap">
      <div class="asc-login-card prv-auth-card">
        <div class="asc-login-head">
          <div class="asc-login-mark" aria-hidden="true"></div>
          <h1>Secure Upload Portal</h1>
          <p>Clinical data submission for Archangel Health partners</p>
        </div>
        <div class="asc-login-body">
          <p class="prv-lead">
            Welcome. Sign in with the username and password from your welcome
            email to begin a secure, encrypted data handover.
          </p>
          <div class="asc-login-error" id="prvLoginError" role="alert" hidden></div>
          <form id="prvLoginForm" novalidate>
            <div class="asc-field">
              <label class="asc-label" for="prvUsername">Username</label>
              <input class="asc-input" id="prvUsername" name="username" type="text"
                     autocomplete="username" autocapitalize="none" spellcheck="false" required />
            </div>
            <div class="asc-field">
              <label class="asc-label" for="prvPassword">Password</label>
              <input class="asc-input" id="prvPassword" name="password" type="password"
                     autocomplete="current-password" required />
            </div>
            <button type="submit" class="asc-btn asc-btn-primary asc-btn-lg asc-btn-block" id="prvLoginBtn">
              Sign in securely
            </button>
          </form>
          <p class="asc-login-hint">
            New here?
            <button type="button" class="prv-linkbtn" id="prvToSignup">Set up a portal
              for your health system</button>
          </p>
          <p class="asc-login-hint">
            Access is logged. Lost your credentials? Reply to your welcome email
            and we will send new ones.
          </p>
        </div>
      </div>
    </div>
  </template>

  <!-- 2) FORCED PASSWORD RESET -->
  <template id="tplReset">
    <div class="prv-auth-wrap">
      <div class="asc-login-card prv-auth-card">
        <div class="asc-login-head">
          <div class="asc-login-mark" aria-hidden="true"></div>
          <h1>Set your password</h1>
          <p>Required before your first upload</p>
        </div>
        <div class="asc-login-body">
          <p class="prv-lead">
            For your security, please replace the temporary password from your
            welcome email with a private password of your own.
          </p>
          <div class="asc-login-error" id="prvResetError" role="alert" hidden></div>
          <div class="asc-inline-ok" id="prvResetOk" hidden></div>
          <form id="prvResetForm" novalidate>
            <div class="asc-field">
              <label class="asc-label" for="prvNewPw">New password
                <span class="asc-label-hint">— at least 12 characters</span></label>
              <input class="asc-input" id="prvNewPw" name="new_password" type="password"
                     autocomplete="new-password" minlength="12" required />
              <div class="prv-strength" id="prvStrength" aria-live="polite"></div>
            </div>
            <div class="asc-field">
              <label class="asc-label" for="prvConfirmPw">Confirm new password</label>
              <input class="asc-input" id="prvConfirmPw" name="confirm_password" type="password"
                     autocomplete="new-password" minlength="12" required />
            </div>
            <button type="submit" class="asc-btn asc-btn-primary asc-btn-lg asc-btn-block" id="prvResetBtn">
              Save password &amp; continue
            </button>
          </form>
          <p class="asc-login-hint">
            Choose something memorable to you but hard to guess. A short passphrase
            of a few words works well.
          </p>
        </div>
      </div>
    </div>
  </template>

  <!-- 3) UPLOAD (the only screen once authed + reset done) -->
  <template id="tplUpload">
    <div class="asc-wrap asc-wrap-narrow prv-upload">

      <!-- Reassuring intro banner -->
      <section class="asc-card prv-intro">
        <div class="asc-card-pad">
          <h1 class="prv-intro-title">Share your data securely</h1>
          <p class="prv-intro-sub" id="prvIntroSub">
            Thank you for partnering with Archangel Health. Drop your files below —
            everything is transmitted over an encrypted connection and only ever
            visible to you and our ingestion team.
          </p>
        </div>
      </section>

      <!-- What we have asked for, when we have asked for anything. Filled by
           provider.js and left empty otherwise: a permanent "no open requests"
           panel is a permanent reminder of an absence. -->
      <div id="prvRequests"></div>

      <div class="prv-grid">
        <!-- Drop zone column -->
        <section class="asc-card">
          <div class="asc-card-head">
            <div>
              <div class="asc-card-title">Upload files</div>
              <div class="asc-card-sub">Multiple files or a single .zip are welcome.</div>
            </div>
          </div>
          <div class="asc-card-pad">
            <!-- Keyboard-usable drop zone. It is a real button that opens the
                 hidden file input; the input itself is the accessible control. -->
            <button type="button" class="prv-drop" id="prvDrop"
                    aria-describedby="prvDropHelp">
              <div class="prv-drop-icon" aria-hidden="true">⤓</div>
              <div class="prv-drop-title">Place your data right here</div>
              <div class="prv-drop-sub">Drag &amp; drop files or a .zip, or click to browse</div>
            </button>
            <p id="prvDropHelp" class="asc-help prv-drop-help">
              Send a .zip, or individual .json / .csv / .hl7 / .txt files and we
              will package them for you. Large files are sent in pieces and can be
              resumed — if the connection drops, drop the same file again and we
              pick up where it stopped.
            </p>
            <input type="file" id="prvFileInput" multiple
                   accept=".zip,.csv,.json,.txt,.xml,.hl7,.ndjson,application/zip,application/json,text/csv,text/plain"
                   class="prv-visually-hidden" aria-label="Choose files to upload" />

            <!-- Live progress + per-batch results -->
            <div class="prv-progress" id="prvProgress" aria-live="polite" hidden>
              <div class="prv-progress-label" id="prvProgressLabel">Uploading…</div>
              <div class="prv-progress-track" role="progressbar" aria-valuemin="0"
                   aria-valuemax="100" aria-valuenow="0" id="prvProgressBar">
                <span class="prv-progress-fill" id="prvProgressFill"></span>
              </div>
            </div>
            <ul class="prv-results" id="prvResults" aria-live="polite"></ul>
          </div>
        </section>

        <!-- "What to send" helper column -->
        <aside class="asc-card prv-helper">
          <div class="asc-card-head">
            <div class="asc-card-title">What to send</div>
          </div>
          <div class="asc-card-pad">
            <ul class="prv-checklist">
              <li>Structured EHR export — <strong>FHIR, HL7, or CSV</strong></li>
              <li>Lab results</li>
              <li>Clinical notes</li>
              <li>Medication &amp; problem lists</li>
              <li>Optional <code>manifest.json</code> describing the contents</li>
            </ul>
            <div class="asc-inline-warn prv-note">
              Please ensure data is <strong>already de-identified and date-shifted</strong>
              before sending. <strong>No imaging.</strong>
            </div>
          </div>
        </aside>
      </div>

      <!-- History (own uploads only) -->
      <section class="asc-card">
        <div class="asc-card-head">
          <div>
            <div class="asc-card-title">Past uploads</div>
            <div class="asc-card-sub">A record of everything you have submitted.</div>
          </div>
          <button type="button" class="asc-btn asc-btn-ghost asc-btn-sm" id="prvRefreshBtn">↻ Refresh</button>
        </div>
        <div class="asc-table-wrap">
          <table class="asc-table prv-history-table">
            <thead>
              <tr>
                <th scope="col">Received</th>
                <th scope="col">File</th>
                <th scope="col">Size</th>
                <th scope="col">Status</th>
                <th scope="col">Details</th>
              </tr>
            </thead>
            <tbody id="prvHistoryBody"></tbody>
          </table>
        </div>
        <div class="prv-history-empty" id="prvHistoryEmpty" hidden>
          <div class="asc-empty-icon" aria-hidden="true">—</div>
          <p>No uploads yet. Your submissions will appear here.</p>
        </div>
      </section>
    </div>
  </template>

  <!-- 4) SIGN UP — the second door. An admin-provisioned partner never sees
       this; a health system that found us on its own has nowhere else to go. -->
  <template id="tplSignup">
    <div class="prv-auth-wrap">
      <div class="asc-login-card prv-auth-card">
        <div class="asc-login-head">
          <div class="asc-login-mark" aria-hidden="true"></div>
          <h1>Set up your portal</h1>
          <p>For health systems sharing clinical data with Archangel Health</p>
        </div>
        <div class="asc-login-body">
          <p class="prv-lead">
            Tell us who you are and choose a password. We will confirm your email,
            then ask a few questions about your data.
          </p>
          <div class="asc-login-error" id="prvSignupError" role="alert" hidden></div>
          <form id="prvSignupForm" novalidate>
            <div class="asc-field">
              <label class="asc-label" for="prvSuName">Your name</label>
              <input class="asc-input" id="prvSuName" name="full_name" type="text"
                     autocomplete="name" required />
            </div>
            <div class="asc-field">
              <label class="asc-label" for="prvSuEmail">Work email</label>
              <input class="asc-input" id="prvSuEmail" name="email" type="email"
                     autocomplete="email" autocapitalize="none" spellcheck="false" required />
            </div>
            <div class="asc-field">
              <label class="asc-label" for="prvSuOrg">Health system</label>
              <input class="asc-input" id="prvSuOrg" name="organization" type="text"
                     autocomplete="organization" required />
            </div>
            <div class="asc-field">
              <label class="asc-label" for="prvSuPw">Choose a password
                <span class="asc-label-hint">— at least 12 characters</span></label>
              <input class="asc-input" id="prvSuPw" name="password" type="password"
                     autocomplete="new-password" minlength="12" required />
              <div class="prv-strength" id="prvSuStrength" aria-live="polite"></div>
            </div>
            <!-- Honeypot. Never shown to a person; always filled by a naive bot. -->
            <input type="text" id="prvSuHp" name="company_website" tabindex="-1"
                   autocomplete="off" aria-hidden="true" class="prv-visually-hidden" />
            <button type="submit" class="asc-btn asc-btn-primary asc-btn-lg asc-btn-block"
                    id="prvSignupBtn">Continue</button>
          </form>
          <p class="asc-login-hint">
            Already have an account?
            <button type="button" class="prv-linkbtn" id="prvToLogin">Sign in</button>
          </p>
        </div>
      </div>
    </div>
  </template>

  <!-- 5) CONFIRM EMAIL — six digits, not a link. Enterprise mail security
       pre-fetches links, which would auto-confirm an address nobody opened. -->
  <template id="tplVerify">
    <div class="prv-auth-wrap">
      <div class="asc-login-card prv-auth-card">
        <div class="asc-login-head">
          <div class="asc-login-mark" aria-hidden="true"></div>
          <h1>Confirm your email</h1>
          <p id="prvVerifySub">We sent you a six-digit code</p>
        </div>
        <div class="asc-login-body">
          <div class="asc-login-error" id="prvVerifyError" role="alert" hidden></div>
          <form id="prvVerifyForm" novalidate>
            <div class="asc-field">
              <label class="asc-label" for="prvVerifyCode">Confirmation code</label>
              <input class="asc-input prv-code-input" id="prvVerifyCode" name="code"
                     type="text" inputmode="numeric" autocomplete="one-time-code"
                     maxlength="6" required />
            </div>
            <button type="submit" class="asc-btn asc-btn-primary asc-btn-lg asc-btn-block"
                    id="prvVerifyBtn">Confirm</button>
          </form>
          <p class="asc-login-hint">
            It expires in 15 minutes.
            <button type="button" class="prv-linkbtn" id="prvResendBtn">Send it again</button>
          </p>
        </div>
      </div>
    </div>
  </template>

  <!-- 6) ABOUT YOU — the first-run intake. Prompt copy comes from the server so
       it lives in one auditable place. -->
  <template id="tplIntake">
    <div class="asc-wrap asc-wrap-narrow prv-panel">
      <section class="asc-card">
        <div class="asc-card-head">
          <div>
            <div class="asc-card-title">About your health system</div>
            <div class="asc-card-sub" id="prvIntakeSub">
              So we come to the first conversation knowing something real.
            </div>
          </div>
        </div>
        <div class="asc-card-pad">
          <div class="asc-inline-ok" id="prvIntakeOk" hidden></div>
          <div class="asc-login-error" id="prvIntakeError" role="alert" hidden></div>
          <form id="prvIntakeForm" novalidate>
            <div id="prvIntakeFields"></div>
            <button type="submit" class="asc-btn asc-btn-primary asc-btn-lg"
                    id="prvIntakeBtn">Save</button>
          </form>
        </div>
      </section>
    </div>
  </template>

  <!-- 7) PAYOUTS -->
  <template id="tplPayouts">
    <div class="asc-wrap asc-wrap-narrow prv-panel">
      <section class="asc-card">
        <div class="asc-card-head">
          <div>
            <div class="asc-card-title">Payouts</div>
            <div class="asc-card-sub">What we have paid your organization.</div>
          </div>
          <button type="button" class="asc-btn asc-btn-ghost asc-btn-sm"
                  id="prvPayoutsRefresh">↻ Refresh</button>
        </div>
        <div class="asc-card-pad">
          <div class="prv-payout-summary" id="prvPayoutSummary"></div>
          <!-- Accrual visibility (PRD §15). Hidden until the server says there
               is a gap, because "0 uploads accepted and awaiting pricing" is a
               sentence that only ever worries the reader. -->
          <div class="prv-accrual" id="prvPayoutAccrual" hidden>
            <p class="prv-accrual-line" id="prvPayoutAccrualLine"></p>
            <p class="prv-accrual-note" id="prvPayoutAccrualNote"></p>
          </div>
        </div>
        <div class="asc-table-wrap" id="prvPayoutTableWrap">
          <table class="asc-table">
            <thead>
              <tr>
                <th scope="col">Recorded</th>
                <th scope="col">For</th>
                <th scope="col">Period</th>
                <th scope="col">Status</th>
                <th scope="col" class="prv-num">Amount</th>
              </tr>
            </thead>
            <tbody id="prvPayoutBody"></tbody>
          </table>
        </div>
        <div class="prv-history-empty" id="prvPayoutEmpty" hidden>
          <div class="asc-empty-icon" aria-hidden="true">—</div>
          <p id="prvPayoutEmptyText"></p>
        </div>
      </section>
      <section class="asc-card" id="prvInvoicesCard">
        <div class="asc-card-head">
          <div>
            <div class="asc-card-title">Invoices</div>
            <div class="asc-card-sub">
              What we have billed, per period. Amounts follow your
              agreement&rsquo;s Schedule A.
            </div>
          </div>
        </div>
        <div class="asc-card-pad">
          <div class="prv-invoices" id="prvInvoices" hidden></div>
        </div>
      </section>
      <section class="asc-card">
        <div class="asc-card-head"><div class="asc-card-title">How we pay</div></div>
        <div class="asc-card-pad">
          <p class="prv-note-text" id="prvHowWePay"></p>
        </div>
      </section>
    </div>
  </template>

  <!-- 8) ACCOUNT — the password change, promoted out of the forced-reset screen. -->
  <template id="tplAccount">
    <div class="asc-wrap asc-wrap-narrow prv-panel">
      <section class="asc-card">
        <div class="asc-card-head">
          <div>
            <div class="asc-card-title">Account</div>
            <div class="asc-card-sub" id="prvAccountSub"></div>
          </div>
        </div>
        <div class="asc-card-pad">
          <div class="asc-login-error" id="prvAccountError" role="alert" hidden></div>
          <div class="asc-inline-ok" id="prvAccountOk" hidden></div>
          <form id="prvAccountForm" novalidate>
            <div class="asc-field">
              <label class="asc-label" for="prvAcCurrent">Current password</label>
              <input class="asc-input" id="prvAcCurrent" type="password"
                     autocomplete="current-password" required />
            </div>
            <div class="asc-field">
              <label class="asc-label" for="prvAcNew">New password
                <span class="asc-label-hint">— at least 12 characters</span></label>
              <input class="asc-input" id="prvAcNew" type="password"
                     autocomplete="new-password" minlength="12" required />
              <div class="prv-strength" id="prvAcStrength" aria-live="polite"></div>
            </div>
            <button type="submit" class="asc-btn asc-btn-primary asc-btn-lg"
                    id="prvAccountBtn">Change password</button>
          </form>
        </div>
      </section>
    </div>
  </template>

  <!-- 9) IN REVIEW — what a locked Upload tab opens onto. A locked surface
       opens the explanation, never a bare refusal. -->
  <template id="tplPending">
    <div class="asc-wrap asc-wrap-narrow prv-panel">
      <section class="asc-card">
        <div class="asc-card-pad prv-pending">
          <div class="asc-empty-icon" aria-hidden="true">·</div>
          <h1 class="prv-intro-title" id="prvPendingTitle">
            We are reviewing your account
          </h1>
          <p class="prv-intro-sub" id="prvPendingNext">
            Uploading opens once someone here has looked at what you told us,
            usually the same day. We will email you when it does.
          </p>
          <p class="prv-intro-sub prv-pending-note">
            Nothing here is hidden from you: whichever step you are on, the
            portal says what happens next and who it is waiting on.
          </p>
          <button type="button" class="asc-btn asc-btn-primary" id="prvPendingIntake">
            Tell us more about your data
          </button>
          <button type="button" class="asc-btn asc-btn-secondary" id="prvPendingSign"
                  hidden>Read and sign the agreement</button>
        </div>
      </section>
    </div>
  </template>

  <!-- 10) YOUR APPLICATION — the four questions, the team, and the free-text
       note, on ONE page. The question copy comes from the server so it lives in
       one auditable place; this template holds only the shape it goes into. -->
  <template id="tplApplication">
    <div class="asc-wrap asc-wrap-narrow prv-panel">
      <section class="asc-card prv-state-card" id="prvStateCard" hidden>
        <div class="asc-card-pad">
          <div class="prv-state-chip" id="prvStateChip"></div>
          <p class="prv-note-text" id="prvStateNext"></p>
        </div>
      </section>

      <section class="asc-card">
        <div class="asc-card-head">
          <div>
            <div class="asc-card-title">About your organization</div>
            <div class="asc-card-sub" id="prvAppSub">
              Four questions. &ldquo;Not sure&rdquo; is a real answer to any of
              them and nothing here commits you to anything.
            </div>
          </div>
        </div>
        <div class="asc-card-pad">
          <div class="asc-inline-ok" id="prvAppOk" hidden></div>
          <div class="asc-login-error" id="prvAppError" role="alert" hidden></div>
          <form id="prvAppForm" novalidate>
            <div id="prvAppFields"></div>
            <button type="submit" class="asc-btn asc-btn-primary asc-btn-lg"
                    id="prvAppBtn">Submit</button>
          </form>
        </div>
      </section>

      <!-- §3.2 — teammates, on the same page. -->
      <section class="asc-card">
        <div class="asc-card-head">
          <div>
            <div class="asc-card-title">Your team</div>
            <div class="asc-card-sub">
              Anyone you add gets their own sign-in, emailed to them.
            </div>
          </div>
        </div>
        <div class="asc-card-pad">
          <ul class="prv-members" id="prvMembers"></ul>
          <div class="asc-inline-ok" id="prvMembersOk" hidden></div>
          <div class="asc-login-error" id="prvMembersError" role="alert" hidden></div>
          <form id="prvMembersForm" novalidate>
            <div id="prvMemberRows"></div>
            <div class="prv-member-actions">
              <button type="button" class="prv-linkbtn" id="prvAddRow">
                + Add another
              </button>
              <button type="submit" class="asc-btn asc-btn-secondary"
                      id="prvMembersBtn">Send invitations</button>
            </div>
          </form>
        </div>
      </section>

      <!-- The older free-text intake, kept and demoted. It is a different
           question ("anything else") from the four above, and folding it away
           means one page rather than two forms that look like each other. -->
      <section class="asc-card">
        <details class="prv-details" id="prvNotesDetails">
          <summary class="asc-card-head prv-details-summary">
            <div>
              <div class="asc-card-title">Anything else we should know</div>
              <div class="asc-card-sub">Optional, and useful. Open to write.</div>
            </div>
          </summary>
          <div class="asc-card-pad">
            <div class="asc-inline-ok" id="prvIntakeOk" hidden></div>
            <div class="asc-login-error" id="prvIntakeError" role="alert" hidden></div>
            <form id="prvIntakeForm" novalidate>
              <div id="prvIntakeFields"></div>
              <button type="submit" class="asc-btn asc-btn-secondary"
                      id="prvIntakeBtn">Save</button>
            </form>
          </div>
        </details>
      </section>
    </div>
  </template>

  <!-- 11) AGREEMENT — the full text on screen, then the clickwrap. No
       download-to-read: an "I have read this" over a document that was never
       rendered is provably false, and that is exactly where the case law is. -->
  <template id="tplAgreement">
    <div class="asc-wrap asc-wrap-narrow prv-panel">
      <section class="asc-card">
        <div class="asc-card-head">
          <div>
            <div class="asc-card-title">Data licensing agreement</div>
            <div class="asc-card-sub" id="prvAgreementSub"></div>
          </div>
          <span class="asc-badge" id="prvAgreementVersion"></span>
        </div>

        <!-- Signed: who, when, and a copy to keep. -->
        <div class="asc-card-pad prv-signed" id="prvSignedBox" hidden>
          <p class="prv-signed-line" id="prvSignedLine"></p>
          <p class="prv-note-text" id="prvSignedHash"></p>
          <a class="asc-btn asc-btn-secondary" id="prvSignedDownload"
             href="/api/asclepius/hs/agreement/document">Download the signed PDF</a>
        </div>

        <div class="asc-card-pad">
          <div class="prv-doc" id="prvAgreementText" tabindex="0"
               role="region" aria-label="Agreement text"></div>
        </div>

        <!-- The clickwrap. Hidden unless this session may actually sign. -->
        <div class="asc-card-pad prv-sign" id="prvSignBox" hidden>
          <div class="asc-login-error" id="prvSignError" role="alert" hidden></div>
          <form id="prvSignForm" novalidate>
            <label class="prv-check">
              <input type="checkbox" id="prvSignAuthority" />
              <span id="prvSignAuthorityLabel"></span>
            </label>
            <label class="prv-check">
              <input type="checkbox" id="prvSignEsign" />
              <span>I agree to conduct this transaction electronically.</span>
            </label>
            <div class="asc-field">
              <label class="asc-label" for="prvSignName">Your full name</label>
              <input class="asc-input" id="prvSignName" type="text"
                     autocomplete="name" maxlength="120" />
            </div>
            <div class="asc-field">
              <label class="asc-label" for="prvSignTitle">Your title</label>
              <input class="asc-input" id="prvSignTitle" type="text"
                     autocomplete="organization-title" maxlength="120"
                     placeholder="Chief Information Officer" />
            </div>
            <button type="submit" class="asc-btn asc-btn-primary asc-btn-lg"
                    id="prvSignBtn" disabled>Sign agreement</button>
            <p class="asc-help prv-sign-help">
              Typing your name and clicking Sign is a legal signature. We record
              the time, the account you are signed in as, and a fingerprint of
              the exact text above, and we email you a countersigned copy.
            </p>
          </form>
        </div>
      </section>
    </div>
  </template>

  <!-- Left rail. A BODY child, not a child of #prvRoot: every panel render
       replaces the root, and navigation that gets wiped by its own destination
       is the oldest bug in this pattern. -->
  <aside class="asc-rail prv-rail" id="prvRail" aria-label="Portal sections" hidden></aside>

  <!-- Toast region for lightweight confirmations / errors -->
  <div class="asc-toast-region" id="prvToasts" aria-live="assertive" aria-atomic="true"></div>

  <script src="/static/provider/provider.js" defer></script>
</body>
</html>
