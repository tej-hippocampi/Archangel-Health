<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asclepius — Expert Review</title>
  <!-- Reuse the console design system verbatim (same pattern as the V5 surface):
       no new fonts, no new colors — only the shared tokens. -->
  <link rel="stylesheet" href="/static/asclepius/clinical-fonts.css" />
  <link rel="stylesheet" href="/static/asclepius/_tokens.css" />
  <style>
    /* Review portal (PRD A Phase 2). Design center: a senior reviewer accepts a
       good submission in under 60 seconds — one column, verdict controls always
       one glance away, the case folded until doubted. */
    * { box-sizing: border-box; }
    body.rv-body {
      margin: 0; background: var(--canvas); color: var(--ink);
      font-family: var(--sans); font-size: var(--t-body); line-height: var(--lh-body);
      -webkit-font-smoothing: antialiased;
    }
    .rv-chrome { font-family: var(--mono); font-size: var(--t-chrome);
      text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-faint); }
    .rv-header { position: sticky; top: 0; z-index: 20; background: var(--card);
      border-bottom: 1px solid var(--hairline); padding: var(--sp-3) var(--sp-5);
      display: flex; align-items: center; gap: var(--sp-4); }
    .rv-header h1 { font-size: var(--t-h3); margin: 0; font-weight: 600; flex: none; }
    /* PRD-P: the billable-session clock. Every value in it comes from a
       heartbeat response — there is no timer in review.js. Lime while running
       (new, needs attention), green once the session is worth paying, and never
       pink: falling short of twenty minutes is not a safety event. */
    .rv-session { flex: none; text-transform: none; letter-spacing: 0;
      font-size: var(--t-sm); color: var(--ink-soft);
      border: 1px solid var(--lime-line); border-radius: var(--r-chip);
      padding: 4px 12px; background: var(--lime-wash); }
    .rv-session.is-qualified { border-color: var(--green-line);
      background: var(--green-wash); color: var(--green-deep); }
    .rv-session.is-warn { border-color: var(--orange-line);
      background: var(--orange-wash); color: var(--orange-deep); }
    .rv-headstats { flex: 1; display: flex; gap: var(--sp-3); align-items: baseline; }
    .rv-main { max-width: 880px; margin: 0 auto; padding: var(--sp-5); }
    .rv-card { background: var(--card); border: 1px solid var(--hairline);
      border-radius: var(--r-md); box-shadow: var(--shadow-card);
      padding: var(--sp-4); margin-bottom: var(--sp-3); }
    .rv-card h3 { font-size: var(--t-sm); margin: 0 0 var(--sp-2); font-weight: 600; }
    .rv-kv { font-size: var(--t-sm); color: var(--ink-soft); }
    .rv-kv b { color: var(--ink); font-weight: 500; }
    pre.rv-mono { font-family: var(--mono); font-size: var(--t-sm); white-space: pre-wrap;
      background: var(--card-in); border-radius: var(--r-sm); padding: var(--sp-2);
      overflow-x: auto; margin: var(--sp-2) 0 0; }
    details.rv-case > summary { cursor: pointer; font-weight: 600; font-size: var(--t-sm); }
    .rv-answer-text { white-space: pre-wrap; margin-top: var(--sp-2); }
    .rv-chip { display: inline-block; font-family: var(--mono); font-size: var(--t-chrome);
      text-transform: uppercase; letter-spacing: 0.06em; border: 1px solid var(--hairline);
      border-radius: var(--r-chip); padding: 2px 10px; color: var(--ink-soft);
      background: var(--card-in); }
    .rv-step { display: flex; gap: var(--sp-2); padding: var(--sp-2) 0;
      border-top: 1px solid var(--hairline); font-size: var(--t-sm); }
    .rv-step:first-of-type { border-top: 0; }
    .rv-step-num { font-family: var(--mono); color: var(--ink-faint); flex: none; width: 22px; }
    .rv-dim { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap;
      padding: var(--sp-2) 0; border-top: 1px solid var(--hairline); }
    .rv-dim:first-of-type { border-top: 0; }
    .rv-dim-label { flex: 1 1 220px; min-width: 200px; }
    .rv-dim-label small { display: block; color: var(--ink-faint); }
    .rv-seg { display: inline-flex; border: 1px solid var(--hairline);
      border-radius: var(--r-chip); overflow: hidden; flex: none; }
    .rv-seg button { border: 0; background: transparent; color: var(--ink-soft);
      font: inherit; font-size: var(--t-sm); padding: 6px 12px; cursor: pointer; }
    .rv-seg button + button { border-left: 1px solid var(--hairline); }
    .rv-seg button.is-on[data-state="agree"] { background: var(--green); color: #fff; }
    .rv-seg button.is-on[data-state="disagree"] { background: var(--pink); color: #fff; }
    .rv-seg button.is-on[data-state="cannot_assess"] { background: var(--ink-faint); color: #fff; }
    .rv-verdicts { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
    .rv-verdicts button { flex: 1 1 160px; border: 1px solid var(--hairline);
      background: var(--card-in); color: var(--ink); font: inherit; font-size: var(--t-sm);
      border-radius: var(--r-sm); padding: var(--sp-3); cursor: pointer; }
    .rv-verdicts button.is-on[data-verdict="accept"] { border-color: var(--green); box-shadow: 0 0 0 2px var(--green); }
    .rv-verdicts button.is-on[data-verdict="accept_with_edits"] { border-color: var(--orange); box-shadow: 0 0 0 2px var(--orange); }
    .rv-verdicts button.is-on[data-verdict="reject"] { border-color: var(--pink); box-shadow: 0 0 0 2px var(--pink); }
    .rv-field { margin-top: var(--sp-3); }
    .rv-field label { display: block; font-size: var(--t-sm); font-weight: 600;
      margin-bottom: var(--sp-1); }
    .rv-field textarea { width: 100%; min-height: 88px; font: inherit; font-size: var(--t-sm);
      color: var(--ink); background: var(--card-in); border: 1px solid var(--hairline);
      border-radius: var(--r-sm); padding: var(--sp-2); resize: vertical; }
    .rv-actions { display: flex; align-items: center; gap: var(--sp-3); margin-top: var(--sp-3); }
    .rv-submit { border: 0; border-radius: var(--r-sm); background: var(--green); color: #fff;
      font: inherit; font-weight: 600; padding: var(--sp-3) var(--sp-5); cursor: pointer; }
    .rv-submit[disabled] { opacity: 0.45; cursor: not-allowed; }
    .rv-error { color: var(--pink); font-size: var(--t-sm); }
    .rv-empty { text-align: center; color: var(--ink-soft); padding: var(--sp-6) 0; }
    .rv-login { max-width: 360px; margin: 12vh auto 0; }
    .rv-login input { width: 100%; font: inherit; font-size: var(--t-sm); color: var(--ink);
      background: var(--card-in); border: 1px solid var(--hairline); border-radius: var(--r-sm);
      padding: var(--sp-2) var(--sp-3); margin-bottom: var(--sp-2); }
    .rv-linkbtn { border: 0; background: transparent; color: var(--ink-soft); font: inherit;
      font-size: var(--t-sm); cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body class="rv-body">
  <div id="reviewRoot"></div>
  <!-- PRD-P: the billable-session heartbeat client (window.AsclepiusSession).
       MUST load before review.js, which calls it when a pair is drawn. Without
       this tag a reviewer works and is credited nothing, silently — which is
       exactly what audit U2 found. Both are `defer`, so document order holds. -->
  <script src="/static/asclepius/earnings.js" defer></script>
  <script src="/static/asclepius/review.js" defer></script>
</body>
</html>
