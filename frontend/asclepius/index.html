<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archangel Health</title>
  <!-- Console design system — self-hosted fonts + shared tokens, no network fonts. -->
  <link rel="stylesheet" href="/static/asclepius/clinical-fonts.css" />
  <link rel="stylesheet" href="/static/asclepius/_tokens.css" />
  <link rel="stylesheet" href="/static/asclepius/_base.css" />
  <link rel="stylesheet" href="/static/asclepius/asclepius.css" />
</head>
<body class="asc-body">
  <!-- App header -->
  <header class="asc-header" id="ascHeader" hidden>
    <div class="asc-header-inner">
      <a class="asc-logo" href="/asclepius">
        <span class="asc-logo-mark" aria-hidden="true"></span>
        <span class="asc-logo-text">Archangel Health<span class="asc-logo-sub">Expert Evaluation Portal</span></span>
      </a>
      <nav class="asc-nav" id="ascNav" aria-label="Primary"></nav>
      <!-- The identity lives at the foot of the rail, once. There used to be a
           second copy here (email + role + specialty + its own Sign out), so a
           physician saw their own name twice and two sign-out buttons. -->
      <div class="asc-header-right"></div>
    </div>
  </header>

  <main class="asc-main" id="ascRoot" aria-live="polite">
    <div class="asc-loading-screen">
      <div class="loading-spinner"></div>
      <p>Loading Archangel Health…</p>
    </div>
  </main>

  <!-- Toast region -->
  <div class="asc-toast-region" id="ascToasts" aria-live="assertive" aria-atomic="true"></div>

  <!-- Instruction Manual content (structured data) — loaded before the app so
       window.ASC_MANUAL is available when the Guide view renders. -->
  <script src="/static/asclepius/manual-content.js" defer></script>
  <!-- PRD-B onboarding module. Owns window.AsclepiusVerification (Seam 1 — the
       name is frozen) and self-mounts the calibration exam and the voluntary
       demographics form on their hash routes. The Physicians section builds its
       own decision report as of the Admin Launch PRD §2/§3, so it no longer
       mounts the queue — but this file still loads first, because the two hash
       routes are the only way a physician can sit the calibration exam. -->
  <script src="/static/asclepius/onboarding.js" defer></script>
  <!-- The four admin bundles used to load here, for every visitor. They are on
       /asclepius/admin now (PRD-F R3): a physician was downloading roughly
       3,600 lines of console code they could never run, and no script tag on
       this page may reference admin_*.js again. -->
  <!-- Referral (PRD-REF) — defines window.ReferralSection, mounted by
       asclepius.js for sessions holding the 'refer' capability. -->
  <script src="/static/asclepius/referral.js" defer></script>
  <!-- First-login walkthrough (Onboarding v2 §6) — defines
       window.FirstRunWalkthrough, mounted by asclepius.js right after sign-in
       for a physician whose checklist still has open stops. Its own file for
       the same reason every other section has one (§3.3 ownership); the shell
       hands it a context and owns nothing about its screens. -->
  <script src="/static/asclepius/first_run.js" defer></script>
  <!-- Earnings (PRD-P §5) — defines window.EarningsSection, mounted by
       asclepius.js, and window.AsclepiusSession, the billable-session heartbeat
       client the review surface drives. It MUST load before review.js: the
       review surface reads server-attested time from that client and computes
       none of its own, and `defer` preserves document order. -->
  <script src="/static/asclepius/earnings.js" defer></script>
  <!-- The clinical chart (PRD-1 §2.2) — window.AsclepiusCasePanel. ONE
       component, rendered identically to the labeler and to the reviewer. It
       loads before both of them because both call into it. -->
  <script src="/static/asclepius/case_panel.js" defer></script>
  <!-- Expert review (PRD-1 §2.1) — window.AsclepiusReview, mounted by
       asclepius.js as `state.view === 'review'`. It is no longer a separate
       page: a reviewer keeps the rail, the session and the design system. -->
  <script src="/static/asclepius/review.js" defer></script>
  <script src="/static/asclepius/asclepius.js" defer></script>
</body>
</html>
